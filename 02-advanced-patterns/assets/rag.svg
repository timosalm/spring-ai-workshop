<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1060" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1060" fill="#ffffff"/>

  <!-- ===== step labels ===== -->
  <g font-size="28" font-weight="600" fill="#7a8896">
    <text x="720" y="70">1. Retrieve</text>
    <text x="70" y="400">2. Augment</text>
    <text x="250" y="835">3. Generate</text>
  </g>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M266,170 L460,170"/>
    <path d="M710,170 L790,170"/>
    <path d="M928,170 L1070,170"/>
    <path d="M390,170 L390,533 L340,533"/>
    <path d="M1190,214 L1190,636 L340,636"/>
    <path d="M210,724 L210,884 L555,884"/>
    <path d="M775,884 L1070,884"/>
  </g>
  <circle cx="390" cy="170" r="5" fill="#7a8896"/>

  <!-- ===== Query ===== -->
  <rect x="60" y="122" width="206" height="96" rx="48" fill="#eef1f4" stroke="#6aa84f" stroke-width="3"/>
  <text x="163" y="182" text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">Query</text>

  <!-- ===== Embedding Model ===== -->
  <rect x="470" y="115" width="240" height="110" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <g text-anchor="middle" font-size="28" font-weight="700" fill="#1c3d5a">
    <text x="590" y="158">Embedding</text>
    <text x="590" y="196">Model</text>
  </g>

  <!-- ===== Vector DB ===== -->
  <path d="M800,118 V222 A60,18 0 0 0 920,222 V118" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <ellipse cx="860" cy="118" rx="60" ry="18" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <g fill="#2b6a8f"><circle cx="896" cy="150" r="4"/><circle cx="896" cy="175" r="4"/><circle cx="896" cy="200" r="4"/></g>
  <text x="860" y="300" text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">Vector DB</text>

  <!-- ===== Context ===== -->
  <rect x="1080" y="130" width="220" height="80" rx="14" fill="#ffffff" stroke="#6aa84f" stroke-dasharray="5,5" stroke-width="3"/>
  <text x="1190" y="180" text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">Context</text>

  <!-- ===== Prompt ===== -->
  <rect x="70" y="430" width="290" height="294" rx="22" fill="#f4f8fb" stroke="#2b6a8f" stroke-width="3"/>
  <text x="215" y="482" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Prompt</text>
  <rect x="100" y="498" width="230" height="70" rx="10" fill="#ffffff" stroke="#6aa84f" stroke-width="2.5"/>
  <text x="215" y="542" text-anchor="middle" font-size="28" fill="#1c3d5a">Query</text>
  <rect x="100" y="600" width="230" height="70" rx="10" fill="#ffffff" stroke="#6aa84f" stroke-dasharray="5,5" stroke-width="2.5"/>
  <text x="215" y="644" text-anchor="middle" font-size="28" fill="#1c3d5a">Context</text>

  <!-- ===== LLM ===== -->
  <rect x="565" y="830" width="210" height="110" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="670" y="898" text-anchor="middle" font-size="34" font-weight="700" fill="#1c3d5a">LLM</text>

  <!-- ===== Response ===== -->
  <rect x="1080" y="844" width="220" height="80" rx="10" fill="#eef1f4"/>
  <text x="1190" y="896" text-anchor="middle" font-size="30" font-weight="700" fill="#5b6b7a">Response</text>
</svg>
