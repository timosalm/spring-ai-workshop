<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 780" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="2000" height="780" fill="#ffffff"/>

  <!-- panels -->
  <g fill="#f4f8fb" stroke="#2b6a8f" stroke-width="3">
    <rect x="60"   y="60" width="380" height="660" rx="22"/>
    <rect x="560"  y="60" width="380" height="660" rx="22"/>
    <rect x="1060" y="60" width="380" height="660" rx="22"/>
    <rect x="1560" y="60" width="380" height="660" rx="22"/>
  </g>

  <!-- titles -->
  <g text-anchor="middle" font-size="34" font-weight="700" fill="#1c3d5a">
    <text x="250"  y="160">Load</text>
    <text x="750"  y="160">Split</text>
    <text x="1250" y="160">Embed</text>
    <text x="1750" y="160">Store</text>
  </g>

  <!-- arrows between panels -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M460,390 L540,390"/>
    <path d="M960,390 L1040,390"/>
    <path d="M1460,390 L1540,390"/>
  </g>

  <!-- ===== LOAD: three document icons ===== -->
  <g stroke="#2b6a8f" stroke-width="3" fill="#ffffff" stroke-linejoin="round">
    <!-- image doc -->
    <path d="M250,230 L340,230 L370,260 L370,380 L250,380 Z"/>
    <path d="M340,230 L340,260 L370,260" fill="none"/>
    <rect x="268" y="315" width="84" height="48" rx="4" fill="#e3eef5" stroke-width="2.5"/>
    <circle cx="286" cy="332" r="7" fill="#2b6a8f" stroke="none"/>
    <path d="M270,360 L300,338 L322,356 L350,332 L350,361 L270,361 Z" fill="#2b6a8f" stroke="none"/>
    <!-- pdf doc -->
    <path d="M150,330 L240,330 L270,360 L270,480 L150,480 Z"/>
    <path d="M240,330 L240,360 L270,360" fill="none"/>
    <text x="210" y="452" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6a8f" stroke="none">PDF</text>
    <!-- txt doc -->
    <path d="M250,430 L340,430 L370,460 L370,580 L250,580 Z"/>
    <path d="M340,430 L340,460 L370,460" fill="none"/>
    <text x="310" y="552" text-anchor="middle" font-size="26" font-weight="700" fill="#2b6a8f" stroke="none">TXT</text>
  </g>

  <!-- ===== SPLIT: text doc -> two docs ===== -->
  <g stroke="#2b6a8f" stroke-width="3" fill="#ffffff" stroke-linejoin="round">
    <path d="M690,220 L790,220 L822,252 L822,380 L690,380 Z"/>
    <path d="M790,220 L790,252 L822,252" fill="none"/>
    <g stroke-width="2.5" stroke-linecap="round">
      <line x1="712" y1="290" x2="800" y2="290"/>
      <line x1="712" y1="315" x2="800" y2="315"/>
      <line x1="712" y1="340" x2="770" y2="340"/>
    </g>
  </g>
  <path d="M735,410 L765,410 L750,432 Z" fill="#7a8896"/>
  <g stroke="#2b6a8f" stroke-width="3" fill="#ffffff" stroke-linejoin="round">
    <path d="M690,470 L790,470 L822,502 L822,630 L690,630 Z"/>
    <path d="M790,470 L790,502 L822,502" fill="none"/>
    <g stroke-width="2.5">
      <rect x="712" y="545" width="88" height="66" fill="#e3eef5"/>
      <line x1="712" y1="567" x2="800" y2="567"/>
      <line x1="712" y1="589" x2="800" y2="589"/>
      <line x1="741" y1="545" x2="741" y2="611"/>
      <line x1="771" y1="545" x2="771" y2="611"/>
    </g>
  </g>

  <!-- ===== EMBED: table doc -> vectors ===== -->
  <g stroke="#2b6a8f" stroke-width="3" fill="#ffffff" stroke-linejoin="round">
    <path d="M1200,220 L1300,220 L1332,252 L1332,380 L1200,380 Z"/>
    <path d="M1300,220 L1300,252 L1332,252" fill="none"/>
    <g stroke-width="2.5">
      <rect x="1222" y="295" width="88" height="66" fill="#e3eef5"/>
      <line x1="1222" y1="317" x2="1310" y2="317"/>
      <line x1="1222" y1="339" x2="1310" y2="339"/>
      <line x1="1251" y1="295" x2="1251" y2="361"/>
      <line x1="1281" y1="295" x2="1281" y2="361"/>
    </g>
  </g>
  <path d="M1235,410 L1265,410 L1250,432 Z" fill="#7a8896"/>
  <g text-anchor="middle" font-size="28" font-weight="700" fill="#1c3d5a">
    <text x="1250" y="500">[ 0.1, 1.8, … ]</text>
    <text x="1250" y="545">[ 1.2, 0.4, … ]</text>
  </g>

  <!-- ===== STORE: vectors -> node graph ===== -->
  <g text-anchor="middle" font-size="28" font-weight="700" fill="#1c3d5a">
    <text x="1750" y="270">[ 0.1, 1.8, … ]</text>
    <text x="1750" y="315">[ 1.2, 0.4, … ]</text>
  </g>
  <path d="M1735,360 L1765,360 L1750,382 Z" fill="#7a8896"/>
  <g stroke="#2b6a8f" stroke-width="4">
    <line x1="1690" y1="470" x2="1810" y2="470"/>
    <line x1="1690" y1="540" x2="1810" y2="540"/>
    <line x1="1690" y1="610" x2="1810" y2="610"/>
    <line x1="1690" y1="470" x2="1690" y2="610"/>
    <line x1="1810" y1="470" x2="1810" y2="610"/>
  </g>
  <g stroke="#2b6a8f" stroke-width="3">
    <circle cx="1690" cy="470" r="18" fill="#ffffff"/>
    <circle cx="1810" cy="470" r="18" fill="#2b6a8f"/>
    <circle cx="1690" cy="540" r="18" fill="#2b6a8f"/>
    <circle cx="1810" cy="540" r="18" fill="#ffffff"/>
    <circle cx="1690" cy="610" r="18" fill="#ffffff"/>
    <circle cx="1810" cy="610" r="18" fill="#2b6a8f"/>
  </g>
</svg>
