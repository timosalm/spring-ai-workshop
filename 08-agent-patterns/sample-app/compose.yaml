services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: support-assistant-postgres
    environment:
      POSTGRES_DB: support_assistant
      POSTGRES_USER: support_assistant
      POSTGRES_PASSWORD: support_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_assistant -d support_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles:
      - postgresql
  lgtm:
    image: grafana/otel-lgtm:latest
    ports:
      - "3000:3000"   # Grafana UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    profiles:
      - otel

volumes:
  postgres-data: