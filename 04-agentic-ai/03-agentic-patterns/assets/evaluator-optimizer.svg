<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 560" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="560" fill="#ffffff"/>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M210,280 L320,280"/>
    <path d="M740,280 L940,280"/>
    <path d="M1360,280 L1790,280"/>
    <path d="M1150,355 C1150,470 530,470 530,355"/>
  </g>

  <!-- Connection labels -->
  <text x="840" y="256" text-anchor="middle" font-size="24" fill="#7a8896">Solution</text>
  <text x="1575" y="256" text-anchor="middle" font-size="24" fill="#7a8896">Accepted</text>
  <text x="840" y="512" text-anchor="middle" font-size="24" fill="#7a8896">Rejected, with feedback for the next attempt</text>

  <!-- ===== In and Out ===== -->
  <rect x="60" y="225" width="150" height="110" rx="10" fill="#eef1f4"/>
  <text x="135" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">In</text>

  <rect x="1790" y="225" width="150" height="110" rx="10" fill="#eef1f4"/>
  <text x="1865" y="290" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">Out</text>

  <!-- ===== Generator and evaluator ===== -->
  <rect x="320" y="205" width="420" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="530" y="270" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call Generator</text>
  <text x="530" y="310" text-anchor="middle" font-size="25" fill="#5b6b7a">Produce a response</text>

  <rect x="940" y="205" width="420" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="1150" y="270" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call Evaluator</text>
  <text x="1150" y="310" text-anchor="middle" font-size="25" fill="#5b6b7a">Check against criteria</text>
</svg>
