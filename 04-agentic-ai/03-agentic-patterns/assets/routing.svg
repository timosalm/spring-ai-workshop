<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 680" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="680" fill="#ffffff"/>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M210,320 L300,320"/>

    <path d="M660,300 C720,300 720,135 800,135"/>
    <path d="M660,320 L800,320"/>
    <path d="M660,340 C720,340 720,505 800,505"/>

    <path d="M1220,135 C1560,135 1600,320 1790,320"/>
    <path d="M1220,320 L1790,320"/>
    <path d="M1220,505 C1560,505 1600,320 1790,320"/>
  </g>

  <!-- Flow label -->
  <text x="1010" y="645" text-anchor="middle" font-size="25" font-weight="600" fill="#7a8896">Only one path is taken</text>

  <!-- ===== In and Out ===== -->
  <rect x="60" y="265" width="150" height="110" rx="10" fill="#eef1f4"/>
  <text x="135" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">In</text>

  <rect x="1790" y="265" width="150" height="110" rx="10" fill="#eef1f4"/>
  <text x="1865" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">Out</text>

  <!-- ===== Router ===== -->
  <rect x="300" y="245" width="360" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="480" y="310" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call Router</text>
  <text x="480" y="350" text-anchor="middle" font-size="25" fill="#5b6b7a">Classify the input</text>

  <!-- ===== Specialized model calls ===== -->
  <g>
    <rect x="800" y="60" width="420" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <text x="1010" y="125" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call 1</text>
    <text x="1010" y="165" text-anchor="middle" font-size="25" fill="#5b6b7a">Billing prompt</text>

    <rect x="800" y="245" width="420" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <text x="1010" y="310" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call 2</text>
    <text x="1010" y="350" text-anchor="middle" font-size="25" fill="#5b6b7a">Technical prompt</text>

    <rect x="800" y="430" width="420" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <text x="1010" y="495" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call 3</text>
    <text x="1010" y="535" text-anchor="middle" font-size="25" fill="#5b6b7a">General prompt</text>
  </g>
</svg>
