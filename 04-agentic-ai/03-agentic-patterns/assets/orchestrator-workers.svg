<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 680" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="680" fill="#ffffff"/>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M200,320 L280,320"/>

    <path d="M640,300 C700,300 700,135 760,135"/>
    <path d="M640,320 L760,320"/>
    <path d="M640,340 C700,340 700,505 760,505"/>

    <path d="M1160,135 C1220,135 1220,320 1280,320"/>
    <path d="M1160,320 L1280,320"/>
    <path d="M1160,505 C1220,505 1220,320 1280,320"/>

    <path d="M1640,320 L1800,320"/>
  </g>

  <!-- Flow label -->
  <text x="960" y="645" text-anchor="middle" font-size="25" font-weight="600" fill="#7a8896">The subtasks are decided at runtime</text>

  <!-- ===== In and Out ===== -->
  <rect x="60" y="265" width="140" height="110" rx="10" fill="#eef1f4"/>
  <text x="130" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">In</text>

  <rect x="1800" y="265" width="140" height="110" rx="10" fill="#eef1f4"/>
  <text x="1870" y="330" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">Out</text>

  <!-- ===== Orchestrator ===== -->
  <rect x="280" y="245" width="360" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="460" y="310" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Orchestrator</text>
  <text x="460" y="350" text-anchor="middle" font-size="25" fill="#5b6b7a">Split into subtasks</text>

  <!-- ===== Workers (created at runtime, so drawn with a dashed border) ===== -->
  <g stroke-dasharray="10 8">
    <rect x="760" y="60" width="400" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <rect x="760" y="245" width="400" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <rect x="760" y="430" width="400" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  </g>
  <g>
    <text x="960" y="125" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Worker 1</text>
    <text x="960" y="165" text-anchor="middle" font-size="25" fill="#5b6b7a">LLM call</text>

    <text x="960" y="310" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Worker 2</text>
    <text x="960" y="350" text-anchor="middle" font-size="25" fill="#5b6b7a">LLM call</text>

    <text x="960" y="495" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Worker 3</text>
    <text x="960" y="535" text-anchor="middle" font-size="25" fill="#5b6b7a">LLM call</text>
  </g>

  <!-- ===== Synthesizer ===== -->
  <rect x="1280" y="245" width="360" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="1460" y="310" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Synthesizer</text>
  <text x="1460" y="350" text-anchor="middle" font-size="25" fill="#5b6b7a">Combine the results</text>
</svg>
