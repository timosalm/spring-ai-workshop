<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 560" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="560" fill="#ffffff"/>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M210,220 L294,220"/>
    <path d="M614,220 L698,220"/>
    <path d="M898,220 L982,220"/>
    <path d="M1302,220 L1386,220"/>
    <path d="M1706,220 L1790,220"/>
    <path d="M798,295 L798,400"/>
  </g>

  <!-- Gate branch labels -->
  <text x="940" y="198" text-anchor="middle" font-size="24" fill="#7a8896">Pass</text>
  <text x="820" y="352" font-size="24" fill="#7a8896">Fail</text>

  <!-- ===== In and Out ===== -->
  <rect x="60" y="165" width="150" height="110" rx="10" fill="#eef1f4"/>
  <text x="135" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">In</text>

  <rect x="1790" y="165" width="150" height="110" rx="10" fill="#eef1f4"/>
  <text x="1865" y="230" text-anchor="middle" font-size="28" font-weight="700" fill="#5b6b7a">Out</text>

  <!-- ===== Model calls ===== -->
  <g>
    <rect x="294" y="145" width="320" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <text x="454" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call 1</text>
    <text x="454" y="250" text-anchor="middle" font-size="25" fill="#5b6b7a">Extract</text>

    <rect x="982" y="145" width="320" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <text x="1142" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call 2</text>
    <text x="1142" y="250" text-anchor="middle" font-size="25" fill="#5b6b7a">Classify</text>

    <rect x="1386" y="145" width="320" height="150" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
    <text x="1546" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">LLM Call 3</text>
    <text x="1546" y="250" text-anchor="middle" font-size="25" fill="#5b6b7a">Summarize</text>
  </g>

  <!-- ===== Gate and exit (your code) ===== -->
  <g>
    <rect x="698" y="145" width="200" height="150" rx="16" fill="#ffffff" stroke="#6aa84f" stroke-width="3"/>
    <text x="798" y="210" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Gate</text>
    <text x="798" y="250" text-anchor="middle" font-size="25" fill="#5b6b7a">Your check</text>

    <rect x="698" y="400" width="200" height="100" rx="16" fill="#ffffff" stroke="#6aa84f" stroke-width="3"/>
    <text x="798" y="462" text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">Exit</text>
  </g>
</svg>
