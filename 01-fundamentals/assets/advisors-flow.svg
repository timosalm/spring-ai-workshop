<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1620" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="1620" fill="#ffffff"/>

  <!-- ===== Advisors container ===== -->
  <rect x="60" y="490" width="1280" height="760" rx="22" fill="#f4f8fb" stroke="#2b6a8f" stroke-width="3"/>
  <text x="700" y="562" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Advisors</text>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <!-- request path, downwards -->
    <path d="M340,140 L340,208"/>
    <path d="M340,352 L340,610"/>
    <path d="M340,762 L340,960 L528,960"/>
    <path d="M580,1048 L580,1352"/>
    <!-- response path, upwards -->
    <path d="M820,1360 L820,1048"/>
    <path d="M858,960 L1060,960 L1060,766"/>
    <path d="M1060,612 L1060,352"/>
    <path d="M1060,208 L1060,148"/>
  </g>

  <!-- ===== Prompt in ===== -->
  <rect x="220" y="54" width="240" height="86" rx="10" fill="#eef1f4"/>
  <text x="340" y="108" text-anchor="middle" font-size="30" font-weight="700" fill="#5b6b7a">Prompt</text>

  <!-- ===== ChatResponse out ===== -->
  <rect x="910" y="54" width="300" height="86" rx="10" fill="#eef1f4"/>
  <text x="1060" y="108" text-anchor="middle" font-size="30" font-weight="700" fill="#5b6b7a">ChatResponse</text>

  <!-- ===== conversion steps ===== -->
  <rect x="150" y="210" width="380" height="140" rx="16" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <g text-anchor="middle" fill="#1c3d5a">
    <text x="340" y="272" font-size="28" font-weight="700">Prompt to</text>
    <text x="340" y="312" font-size="28" font-weight="700">ChatClientRequest</text>
  </g>

  <rect x="850" y="210" width="420" height="140" rx="16" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <g text-anchor="middle" fill="#1c3d5a">
    <text x="1060" y="272" font-size="28" font-weight="700">ChatClientResponse</text>
    <text x="1060" y="312" font-size="28" font-weight="700">to ChatResponse</text>
  </g>

  <!-- ===== advising steps ===== -->
  <rect x="200" y="620" width="280" height="140" rx="16" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <text x="340" y="702" text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">Before advising</text>

  <rect x="920" y="620" width="280" height="140" rx="16" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <text x="1060" y="702" text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">After advising</text>

  <!-- ===== Advisor (internal) ===== -->
  <rect x="550" y="880" width="300" height="160" rx="16" fill="#ffffff" stroke="#6aa84f" stroke-width="3"/>
  <g text-anchor="middle">
    <text x="700" y="948" font-size="32" font-weight="700" fill="#1c3d5a">Advisor</text>
    <text x="700" y="988" font-size="25" fill="#5b6b7a">internal</text>
  </g>

  <!-- ===== Chat Model ===== -->
  <rect x="560" y="1360" width="280" height="120" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="700" y="1432" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Chat Model</text>

  <!-- ===== connection labels ===== -->
  <g>
    <rect x="205" y="396" width="270" height="60" rx="8" fill="#eef1f4"/>
    <text x="340" y="434" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatClientRequest</text>

    <rect x="917" y="396" width="286" height="60" rx="8" fill="#eef1f4"/>
    <text x="1060" y="434" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatClientResponse</text>

    <rect x="205" y="820" width="270" height="60" rx="8" fill="#eef1f4"/>
    <text x="340" y="858" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatClientRequest</text>

    <rect x="917" y="820" width="286" height="60" rx="8" fill="#eef1f4"/>
    <text x="1060" y="858" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatClientResponse</text>

    <rect x="510" y="1160" width="140" height="60" rx="8" fill="#eef1f4"/>
    <text x="580" y="1198" text-anchor="middle" font-size="24" fill="#5b6b7a">Prompt</text>

    <rect x="715" y="1160" width="210" height="60" rx="8" fill="#eef1f4"/>
    <text x="820" y="1198" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatResponse</text>
  </g>
</svg>
