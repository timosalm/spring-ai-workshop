<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 1350" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="1350" fill="#ffffff"/>

  <!-- ===== Repeatable region ===== -->
  <rect x="120" y="330" width="680" height="980" rx="22" fill="#ffffff" stroke="#7a8896" stroke-width="2.5" stroke-dasharray="12 9"/>
  <text x="85" y="835" text-anchor="middle" font-size="27" font-weight="600" fill="#7a8896" transform="rotate(-90 85 835)">Repeatable</text>

  <!-- ===== Connections between the advisors ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round">
    <!-- request lane, downwards -->
    <path d="M300,80 L300,152" marker-end="url(#arrow)"/>
    <path d="M300,270 L300,400"/>
    <path d="M300,760 L300,832" marker-end="url(#arrow)"/>
    <path d="M300,950 L300,1122" marker-end="url(#arrow)"/>
    <!-- response lane, upwards -->
    <path d="M620,1130 L620,958" marker-end="url(#arrow)"/>
    <path d="M620,840 L620,760"/>
    <path d="M620,400 L620,278" marker-end="url(#arrow)"/>
    <path d="M620,152 L620,80" marker-end="url(#arrow)"/>
  </g>

  <!-- ===== lane labels ===== -->
  <g>
    <rect x="165" y="26" width="270" height="44" rx="8" fill="#eef1f4"/>
    <text x="300" y="56" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatClientRequest</text>

    <rect x="477" y="26" width="286" height="44" rx="8" fill="#eef1f4"/>
    <text x="620" y="56" text-anchor="middle" font-size="24" fill="#5b6b7a">ChatClientResponse</text>
  </g>

  <!-- ===== ellipsis between advisors ===== -->
  <g fill="#7a8896">
    <circle cx="424" cy="300" r="5"/><circle cx="442" cy="300" r="5"/><circle cx="460" cy="300" r="5"/><circle cx="478" cy="300" r="5"/>
    <circle cx="424" cy="1010" r="5"/><circle cx="442" cy="1010" r="5"/><circle cx="460" cy="1010" r="5"/><circle cx="478" cy="1010" r="5"/>
  </g>

  <!-- ===== Advisor ABC ===== -->
  <rect x="200" y="160" width="520" height="110" rx="16" fill="#ffffff" stroke="#6aa84f" stroke-width="3"/>
  <text x="460" y="228" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Advisor ABC</text>

  <!-- ===== Advisor XYZ ===== -->
  <rect x="200" y="840" width="520" height="110" rx="16" fill="#ffffff" stroke="#6aa84f" stroke-width="3"/>
  <text x="460" y="908" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Advisor XYZ</text>

  <!-- ===== Recursive Advisor ===== -->
  <rect x="200" y="400" width="520" height="360" rx="18" fill="#f4f8fb" stroke="#6aa84f" stroke-width="3"/>
  <text x="460" y="456" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Recursive Advisor</text>

  <!-- connections inside the recursive advisor -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M300,400 L300,630" marker-end="url(#arrow)"/>
    <path d="M620,760 L620,728" marker-end="url(#arrow)"/>
    <path d="M620,640 L620,578" marker-end="url(#arrow)"/>
    <path d="M620,490 L620,400"/>
    <path d="M548,530 C470,540 350,556 340,630" marker-end="url(#arrow)"/>
  </g>

  <!-- decision -->
  <path d="M550,530 L620,490 L690,530 L620,570 Z" fill="#ffffff" stroke="#2b6a8f" stroke-width="3" stroke-linejoin="round"/>
  <text x="620" y="543" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">?</text>

  <!-- before / after steps -->
  <rect x="220" y="640" width="160" height="80" rx="12" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <text x="300" y="690" text-anchor="middle" font-size="28" font-weight="700" fill="#1c3d5a">Before</text>
  <rect x="540" y="640" width="160" height="80" rx="12" fill="#ffffff" stroke="#2b6a8f" stroke-width="3"/>
  <text x="620" y="690" text-anchor="middle" font-size="28" font-weight="700" fill="#1c3d5a">After</text>

  <!-- ===== Chat Model ===== -->
  <rect x="250" y="1130" width="420" height="120" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="460" y="1202" text-anchor="middle" font-size="32" font-weight="700" fill="#1c3d5a">Chat Model</text>
</svg>
