<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 720" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0.5,0.5 L8,4 L0.5,7.5" fill="none" stroke="#7a8896" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1700" height="720" fill="#ffffff"/>

  <!-- ===== Connections (drawn first, behind boxes) ===== -->
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M530,445 L600,445"/>
    <path d="M840,445 L890,445"/>
  </g>
  <g stroke="#7a8896" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="10 8" marker-end="url(#arrow)">
    <path d="M720,382 L720,330"/>
  </g>

  <!-- ===== Tokens callout ===== -->
  <g stroke="#7a8896" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M125,396 L272,348"/>
    <path d="M240,396 L277,348"/>
    <path d="M340,396 L283,348"/>
    <path d="M455,396 L288,348"/>
  </g>
  <text x="280" y="322" text-anchor="middle" font-size="27" font-weight="600" fill="#7a8896">Tokens</text>

  <!-- ===== Prompt tokens ===== -->
  <g stroke="#2b6a8f" stroke-width="3">
    <rect x="50"  y="400" width="150" height="92" rx="10" fill="#ffffff"/>
    <rect x="200" y="400" width="80"  height="92" rx="10" fill="#ffffff"/>
    <rect x="280" y="400" width="120" height="92" rx="10" fill="#e3eef5"/>
    <rect x="400" y="400" width="110" height="92" rx="10" fill="#e3eef5"/>
  </g>
  <g text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">
    <text x="125" y="456">Spring</text>
    <text x="240" y="456">AI</text>
    <text x="340" y="456">simpl</text>
    <text x="455" y="456">ifies</text>
  </g>

  <!-- subword annotation -->
  <path d="M282,502 v6 q0,12 12,12 h87 q11,0 14,11 q3,-11 14,-11 h87 q12,0 12,-12 v-6"
        fill="none" stroke="#7a8896" stroke-width="2.5" stroke-linecap="round"/>
  <text x="395" y="566" text-anchor="middle" font-size="24" fill="#7a8896">one word, two subword tokens</text>

  <!-- Prompt brace -->
  <path d="M52,596 v6 q0,12 12,12 h202 q11,0 14,11 q3,-11 14,-11 h202 q12,0 12,-12 v-6"
        fill="none" stroke="#7a8896" stroke-width="2.5" stroke-linecap="round"/>
  <text x="280" y="668" text-anchor="middle" font-size="27" font-weight="600" fill="#7a8896">Prompt</text>

  <!-- ===== Next token candidates ===== -->
  <rect x="560" y="60" width="520" height="260" rx="18" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="820" y="112" text-anchor="middle" font-size="27" font-weight="700" fill="#1c3d5a">Next token candidates</text>
  <g font-size="30" fill="#1c3d5a">
    <text x="620" y="180">development</text>
    <text x="620" y="235">integration</text>
    <text x="620" y="290">building</text>
  </g>
  <path d="M990,298 L990,155" fill="none" stroke="#7a8896" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="1035" y="226" text-anchor="middle" font-size="24" fill="#7a8896" transform="rotate(-90 1035 226)">more likely</text>

  <!-- ===== LLM ===== -->
  <rect x="615" y="390" width="210" height="110" rx="16" fill="#e3eef5" stroke="#2b6a8f" stroke-width="3"/>
  <text x="720" y="458" text-anchor="middle" font-size="34" font-weight="700" fill="#1c3d5a">LLM</text>

  <!-- ===== Completion ===== -->
  <g stroke-width="3">
    <rect x="905"  y="400" width="140" height="92" rx="10" fill="#ffffff" stroke="#2b6a8f"/>
    <rect x="1045" y="400" width="75"  height="92" rx="10" fill="#ffffff" stroke="#2b6a8f"/>
    <rect x="1120" y="400" width="115" height="92" rx="10" fill="#e3eef5" stroke="#2b6a8f"/>
    <rect x="1235" y="400" width="105" height="92" rx="10" fill="#e3eef5" stroke="#2b6a8f"/>
    <rect x="1340" y="400" width="245" height="92" rx="10" fill="#ffffff" stroke="#6aa84f"/>
  </g>
  <g text-anchor="middle" font-size="30" font-weight="700" fill="#1c3d5a">
    <text x="975"  y="456">Spring</text>
    <text x="1082" y="456">AI</text>
    <text x="1177" y="456">simpl</text>
    <text x="1287" y="456">ifies</text>
    <text x="1462" y="456">development</text>
  </g>

  <!-- Completion brace -->
  <path d="M907,596 v6 q0,12 12,12 h312 q11,0 14,11 q3,-11 14,-11 h312 q12,0 12,-12 v-6"
        fill="none" stroke="#7a8896" stroke-width="2.5" stroke-linecap="round"/>
  <text x="1245" y="668" text-anchor="middle" font-size="27" font-weight="600" fill="#7a8896">Completion</text>
</svg>
