spring.application.name=support-assistant
spring.devtools.restart.enabled=true

spring.docker.compose.lifecycle-management=none
logging.level.org.springframework.ai=debug

spring.mvc.apiversion.use.path-segment=1
spring.mvc.apiversion.supported=1.0
spring.mvc.apiversion.default=1.0

spring.ai.model.chat=openai

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.model=gpt-5.4-mini
spring.ai.openai.chat.temperature=0.7
# Azure or AI middleware spring.ai.openai.base-url=

spring.ai.model.embedding=openai
spring.ai.openai.embedding.model=text-embedding-3-small

# Uncomment for PostgreSQL as vector store via Docker Compose instead of in-memory
# spring.ai.vectorstore.pgvector.initialize-schema=true
# spring.ai.vectorstore.pgvector.remove-existing-vector-store-table=true
# spring.docker.compose.lifecycle-management=start-and-stop
# spring.docker.compose.profiles.active=postgresql

spring.datasource.url=jdbc:h2:mem:supportdb;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
spring.datasource.driver-class-name=org.h2.Driver